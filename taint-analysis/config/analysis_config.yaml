taint_analysis:
  enabled: true
  sensitivity_levels:
    - low
    - medium
    - high
  track_flows: true
  leak_detection:
    enabled: true
    methods:
      - print
      - write
      - insert
      - set_cookie
      - log
      - post
      - redirect

data_privacy:
  gdpr_compliance:
    enabled: true
    checks:
      - data_minimization
      - purpose_limitation
      - storage_limitation
      - integrity_and_confidentiality

compliance_checks:
  enabled: true
  standards:
    - gdpr
    - ccp
    - hipaa